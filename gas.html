<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;

body{
    background:#f4f4f4;

.container{
    width:85%;

    padding:40px;
    border-radius:8px;
    box-shadow:0 0 10px rgba(0,0,0,.1);

h1{

.line{

.search-box{
    display:flex;

    margin-bottom:40px;
}

.search-box input{
    width:400px;
    padding:12px;
    font-size:18px;
    border:1px solid #ccc;
    border-radius:5px 0 0 5px;
    outline:none;
}

.search-box button{
    padding:12px 20px;
    border:none;
    background:#0d6efd;
    color:#fff;
    cursor:pointer;
    font-size:18px;
    border-radius:0 5px 5px 0;
}

.search-box button:hover{
    background:#0b5ed7;
}

.service{
    margin-bottom:50px;
}

.row{
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
}

.title{
    font-size:30px;
    transition:.3s;
}

.arrow{
    font-size:32px;
    color:#0066ff;
}

.link{
    font-size:30px;
    color:blue;
    text-decoration:none;
}

.link:hover{
    text-decoration:underline;
}

ul{
    margin-top:15px;
    margin-left:40px;
}

li{
    font-size:15px;
}

.highlight{
    background:yellow;
    padding:4px 8px;
    border-radius:4px;
}
</style>

<script>

function searchTitle(){

    let input = document.getElementById("search").value.trim().toLowerCase();
    let titles = document.querySelectorAll(".title");

    // Remove old highlight
    titles.forEach(function(title){
        title.classList.remove("highlight");
    });

    if(input==="") return;

    let found = false;

    titles.forEach(function(title){

        if(!found && title.innerText.toLowerCase().includes(input)){

            title.classList.add("highlight");

            title.scrollIntoView({
                behavior:"smooth",
                block:"center"
            });

            found = true;
        }

    });

}

// Search button + Enter key
document.getElementById("search").addEventListener("keydown", function(e){

    if(e.key==="Enter"){
        e.preventDefault();
        searchTitle();
    }

});

</script>
